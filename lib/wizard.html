<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Настройка подключения</title>
<style>
:root {
  --bg: #0d1117;
  --card: #161b22;
  --card2: #1c2129;
  --text: #e6edf3;
  --muted: #8b949e;
  --accent: #58a6ff;
  --accent-dim: rgba(88,166,255,0.15);
  --ok: #3fb950;
  --ok-dim: rgba(63,185,80,0.15);
  --err: #f85149;
  --err-dim: rgba(248,81,73,0.15);
  --warn: #d29922;
  --warn-dim: rgba(210,153,34,0.15);
  --border: #30363d;
  --radius: 12px;
}
@media (prefers-color-scheme: light) {
  :root {
    --bg: #f6f8fa;
    --card: #ffffff;
    --card2: #f0f3f6;
    --text: #1f2328;
    --muted: #656d76;
    --accent: #0969da;
    --accent-dim: rgba(9,105,218,0.12);
    --ok: #1a7f37;
    --ok-dim: rgba(26,127,55,0.12);
    --err: #cf222e;
    --err-dim: rgba(207,34,46,0.12);
    --warn: #9a6700;
    --warn-dim: rgba(154,103,0,0.12);
    --border: #d0d7de;
  }
}
* { box-sizing: border-box; margin: 0; }
body {
  min-height: 100vh;
  background: var(--bg);
  color: var(--text);
  font: 14px/1.6 -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  padding: 16px;
  display: flex;
  justify-content: center;
}
.wizard { width: 100%; max-width: 480px; padding-top: 24px; }
.logo { text-align: center; margin-bottom: 24px; }
.logo svg { width: 48px; height: 48px; }
.logo h1 { font-size: 18px; font-weight: 600; margin-top: 8px; }
.logo p { color: var(--muted); font-size: 13px; margin-top: 4px; }

.steps { display: flex; gap: 4px; margin-bottom: 24px; }
.steps .dot { flex: 1; height: 4px; border-radius: 2px; background: var(--border); transition: background 0.3s; }
.steps .dot.active { background: var(--accent); }
.steps .dot.done { background: var(--ok); }

.step { display: none; }
.step.visible { display: block; }

.card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; margin-bottom: 16px; }
.card h2 { font-size: 15px; font-weight: 600; margin-bottom: 4px; }
.card p.desc { color: var(--muted); font-size: 13px; margin-bottom: 16px; }

label { display: block; font-size: 13px; font-weight: 500; color: var(--muted); margin-bottom: 4px; }
input[type="text"] {
  width: 100%;
  padding: 10px 12px;
  background: var(--card2);
  border: 1px solid var(--border);
  border-radius: 8px;
  color: var(--text);
  font: inherit;
  font-size: 13px;
  outline: none;
  transition: border-color 0.2s;
}
input:focus { border-color: var(--accent); }
.field { margin-bottom: 14px; }
.help { color: var(--muted); font-size: 12px; margin-top: 4px; }

.check { display: flex; align-items: flex-start; gap: 10px; margin-bottom: 14px; color: var(--text); font-size: 13px; font-weight: 400; cursor: pointer; }
.check input { margin-top: 3px; flex-shrink: 0; }

.badge { display: inline-flex; align-items: center; gap: 5px; padding: 4px 10px; border-radius: 999px; font-size: 12px; font-weight: 500; }
.badge.ok { background: var(--ok-dim); color: var(--ok); }
.badge.err { background: var(--err-dim); color: var(--err); }
.badge.wait { background: var(--accent-dim); color: var(--accent); }
.badge.warn { background: var(--warn-dim); color: var(--warn); }
.badge::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; flex-shrink: 0; }

.profile { display: flex; align-items: center; gap: 12px; padding: 12px; background: var(--card2); border-radius: 8px; margin-top: 12px; }
.profile .name { font-weight: 600; font-size: 14px; word-break: break-word; }
.profile .phone { color: var(--muted); font-size: 12px; }
.profile .uid { color: var(--muted); font-size: 11px; font-family: monospace; word-break: break-all; }
.avatar {
  width: 40px; height: 40px; border-radius: 50%;
  background: var(--accent-dim);
  display: flex; align-items: center; justify-content: center;
  font-size: 18px; font-weight: 600; color: var(--accent); flex-shrink: 0;
}

.actions { display: flex; gap: 8px; margin-top: 16px; }
.btn { flex: 1; padding: 10px 16px; border: none; border-radius: 8px; font: inherit; font-size: 14px; font-weight: 600; cursor: pointer; transition: opacity 0.2s; }
.btn:active { opacity: 0.8; }
.btn:disabled { opacity: 0.4; cursor: default; }
.btn-primary { background: var(--accent); color: #fff; }
.btn-secondary { background: var(--card2); color: var(--text); border: 1px solid var(--border); }
.btn-ok { background: var(--ok); color: #fff; }

.btn-service {
  display: flex; align-items: center; justify-content: center; gap: 8px;
  padding: 12px 20px; width: 100%;
  background: linear-gradient(135deg, #0077ff 0%, #0055cc 100%);
  color: #fff; border: none; border-radius: 12px;
  font: inherit; font-size: 15px; font-weight: 600; cursor: pointer;
  transition: transform 0.15s, box-shadow 0.15s;
}
.btn-service:hover { transform: translateY(-1px); box-shadow: 0 4px 12px rgba(0,119,255,0.3); }
.btn-service:active { transform: translateY(0); }
.btn-service:disabled { opacity: 0.5; cursor: default; transform: none; box-shadow: none; }

.hint-box { background: var(--card2); border: 1px solid var(--border); border-radius: 8px; padding: 12px; margin-top: 12px; font-size: 12px; color: var(--muted); line-height: 1.5; }
.hint-box summary { cursor: pointer; color: var(--accent); font-weight: 500; }
.hint-box ol { padding-left: 16px; margin-top: 8px; }
.hint-box li { margin-bottom: 4px; }
.hint-box code { background: var(--bg); padding: 1px 4px; border-radius: 3px; font-size: 11px; }
.hint-box.warn { border-color: var(--warn); }

.manual-toggle { display: none; text-align: center; color: var(--muted); font-size: 12px; margin-top: 12px; cursor: pointer; text-decoration: none; }
.manual-toggle:hover { color: var(--accent); }

.summary-row { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--border); font-size: 13px; }
.summary-row:last-child { border-bottom: none; }
.summary-row .key { color: var(--muted); flex-shrink: 0; }
.summary-row .val { font-weight: 500; font-family: monospace; font-size: 12px; text-align: right; word-break: break-all; }

.spinner { display: inline-block; width: 14px; height: 14px; border: 2px solid rgba(255,255,255,0.3); border-top-color: currentColor; border-radius: 50%; animation: spin 0.6s linear infinite; vertical-align: middle; }
@keyframes spin { to { transform: rotate(360deg); } }

.seg { display: flex; gap: 4px; padding: 3px; margin-bottom: 14px; background: var(--card2); border: 1px solid var(--border); border-radius: 10px; }
.seg button { flex: 1; padding: 8px; border: none; border-radius: 8px; background: transparent; color: var(--muted); font: inherit; font-size: 13px; font-weight: 600; cursor: pointer; }
.seg button.on { background: var(--accent); color: #fff; }

.inline { display: flex; gap: 8px; align-items: stretch; }
.inline input { flex: 1; min-width: 0; }
.inline .btn { flex: 0 0 auto; padding: 10px 14px; }

.report { margin-top: 12px; }
.report summary { cursor: pointer; color: var(--accent); font-weight: 500; font-size: 12px; }
.report .row { display: flex; gap: 8px; align-items: baseline; padding: 3px 0; font-size: 12px; color: var(--text); }
.report .mark { width: 14px; flex-shrink: 0; text-align: center; font-weight: 700; }
.report .row.ok .mark { color: var(--ok); }
.report .row.bad .mark { color: var(--err); }
.report .note { display: block; color: var(--muted); font-size: 11px; font-family: monospace; word-break: break-word; }
</style>
</head>
<body>
<div class="wizard">
  <div class="logo">
    <svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
      <circle cx="24" cy="24" r="22" stroke="var(--accent)" stroke-width="2.5"/>
      <path d="M24 13 L33 18.5 V29.5 L24 35 L15 29.5 V18.5 Z" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round"/>
      <circle cx="24" cy="24" r="4" fill="var(--accent)"/>
    </svg>
    <h1 id="title"></h1>
    <p id="tagline"></p>
  </div>

  <div class="steps" id="steps">
    <div class="dot active"></div>
    <div class="dot"></div>
    <div class="dot"></div>
  </div>

  <!-- Step 1: the link -->
  <div class="step visible" id="step1">
    <div class="card">
      <h2 id="linkTitle"></h2>
      <p class="desc" id="linkDesc"></p>
      <div class="seg" id="seg" style="display:none">
        <button type="button" id="segNew"></button>
        <button type="button" id="segHave" class="on"></button>
      </div>
      <div id="newBox" style="display:none">
        <div id="accountBox" style="display:none;margin-bottom:16px">
          <p class="desc" id="accountDesc"></p>
          <button class="btn-service" id="accountBtn"></button>
          <div id="accountStatus" style="margin-top:12px"></div>
          <div id="accountReport"></div>
        </div>
        <p class="desc" id="createDesc"></p>
        <button class="btn-service" id="createBtn"></button>
        <div id="createStatus" style="margin-top:12px"></div>
      </div>
      <div id="haveBox">
        <div class="field">
          <label for="linkUrl" id="linkLabel"></label>
          <div class="inline">
            <input type="text" id="linkUrl" autocomplete="off" autocapitalize="off" spellcheck="false">
            <button type="button" class="btn btn-secondary" id="copyBtn" style="display:none">Копировать</button>
          </div>
        </div>
        <button class="btn-service" id="checkBtn"></button>
      </div>
      <div id="checkStatus" style="margin-top:12px"></div>
      <div id="checkInfo"></div>
      <div id="checkReport"></div>
      <a class="manual-toggle" id="skipCheck" href="#">Продолжить без проверки</a>
      <details class="hint-box" id="howBox">
        <summary id="howTitle"></summary>
        <ol id="howList"></ol>
      </details>
    </div>
    <div class="actions">
      <button class="btn btn-primary" id="step1Next" disabled>Далее</button>
    </div>
  </div>

  <!-- Step 2: the mode -->
  <div class="step" id="step2">
    <div class="card">
      <h2 id="modeTitle"></h2>
      <p class="desc" id="modeDesc"></p>
      <label class="check" for="onlyClient">
        <input type="checkbox" id="onlyClient">
        <span id="onlyClientText"></span>
      </label>
      <div id="optionsBox"></div>
      <div class="hint-box warn" id="modeNote" style="display:none"></div>
      <div id="step2Status" style="margin-top:12px"></div>
    </div>
    <div class="actions">
      <button class="btn btn-secondary" id="step2Back">Назад</button>
      <button class="btn btn-primary" id="step2Next">Далее</button>
    </div>
  </div>

  <!-- Step 3: summary + submit -->
  <div class="step" id="step3">
    <div class="card">
      <h2 id="doneTitle"></h2>
      <p class="desc">Всё настроено. Проверьте и подтвердите.</p>
      <div id="summary"></div>
    </div>
    <div class="actions">
      <button class="btn btn-secondary" id="step3Back">Назад</button>
      <button class="btn btn-ok" id="submitBtn">Готово</button>
    </div>
  </div>
</div>

<script id="init" type="application/json">{}</script>
<script>
// The script fills in the init block: cfg (the texts and the options of the service this wizard is for) and values (what
// it already has: the link, the options). Everything the page says about a service comes from there.
var INIT = {};
try { INIT = JSON.parse(document.getElementById("init").textContent || "{}"); } catch (e) {}
var CFG = INIT.cfg || {};
var VAL = INIT.values || {};
var LINK = CFG.link || {};
var CREATE = CFG.create || null;
var MODE = CFG.mode || {};
var OPTIONS = CFG.options || [];
var SERVICE = CFG.service || "";

var state = { step: 1, url: "", checked: false, info: null, skipped: false };

function $(id) { return document.getElementById(id); }

function esc(s) {
  var d = document.createElement("div");
  d.textContent = s == null ? "" : String(s);
  return d.innerHTML;
}

function badge(type, html) {
  return '<span class="badge ' + type + '">' + html + '</span>';
}

var SPIN = '<span class="spinner"></span> ';

function api(path, body) {
  return fetch("/api/" + path, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(body)
  }).then(function (r) { return r.json(); });
}

// What the script did, step by step: a mark, the step and its note (a status or the shape of an answer, never a secret).
function reportHTML(steps, open) {
  if (!steps || !steps.length) return "";
  var h = '<details class="hint-box report"' + (open ? " open" : "") + '><summary>Ход проверки</summary>';
  for (var i = 0; i < steps.length; i++) {
    var s = steps[i];
    h += '<div class="row ' + (s.ok ? "ok" : "bad") + '"><span class="mark">' + (s.ok ? "✓" : "✗") + '</span><span>' +
      esc(s.label || s.id) + (s.note ? '<span class="note">' + esc(s.note) + '</span>' : "") + '</span></div>';
  }
  return h + "</details>";
}

// ── The texts ──

document.title = CFG.title || ("Подключение через " + SERVICE);
$("title").textContent = CFG.title || ("Подключение через " + SERVICE);
$("tagline").textContent = CFG.tagline || "Мастер настройки туннеля";
$("linkTitle").textContent = LINK.title || "Шаг 1: Ссылка";
$("linkDesc").textContent = LINK.desc || "";
$("linkDesc").style.display = LINK.desc ? "block" : "none";
$("linkLabel").textContent = LINK.label || "Ссылка";
$("linkUrl").placeholder = LINK.placeholder || "https://…";
$("checkBtn").textContent = LINK.check || "Проверить ссылку";
$("howTitle").textContent = LINK.howTitle || "Где взять ссылку и что нужно знать";
if (LINK.how && LINK.how.length) {
  var li = "";
  for (var hi = 0; hi < LINK.how.length; hi++) li += "<li>" + LINK.how[hi] + "</li>";
  $("howList").innerHTML = li;
} else {
  $("howBox").style.display = "none";
}
$("modeTitle").textContent = MODE.title || "Шаг 2: Режим";
$("modeDesc").textContent = MODE.desc || "Как клиент и нода будут связываться.";
$("onlyClientText").textContent = MODE.onlyClient || "Нода уже работает: настроить только клиента";
$("doneTitle").textContent = "Шаг 3: Готово";
if (MODE.note) {
  $("modeNote").textContent = MODE.note;
  $("modeNote").style.display = "block";
}

var optHTML = "";
for (var oi = 0; oi < OPTIONS.length; oi++) {
  var o = OPTIONS[oi];
  optHTML += '<label class="check" for="opt_' + esc(o.key) + '"><input type="checkbox" id="opt_' + esc(o.key) + '"' +
    ((VAL[o.key] === true || VAL[o.key] === "true" || (VAL[o.key] === undefined && o.default)) ? " checked" : "") +
    '><span>' + esc(o.label) + '</span></label>' +
    (o.help ? '<div class="help" style="margin:-6px 0 14px 26px">' + esc(o.help) + '</div>' : "");
}
$("optionsBox").innerHTML = optHTML;

// ── Step navigation ──

function goStep(n) {
  state.step = n;
  for (var i = 1; i <= 3; i++) $("step" + i).classList.toggle("visible", i === n);
  var dots = document.querySelectorAll(".steps .dot");
  for (var j = 0; j < dots.length; j++) {
    dots[j].className = "dot" + (j < n - 1 ? " done" : j === n - 1 ? " active" : "");
  }
  if (n === 3) renderSummary();
}

// ── Step 1: the link ──

// "Создать на сайте" / "Есть ссылка": the first needs the app's sign-in window (the page opens the site in it).
var canCreate = !!(CREATE && typeof window.openfluxLogin === "function");

function setSeg(which) {
  $("segNew").classList.toggle("on", which === "new");
  $("segHave").classList.toggle("on", which === "have");
  $("newBox").style.display = which === "new" ? "block" : "none";
  $("haveBox").style.display = which === "have" ? "block" : "none";
  var show = which === "have" ? "block" : "none";
  $("checkStatus").style.display = show;
  $("checkInfo").style.display = show;
  $("checkReport").style.display = show;
  $("skipCheck").style.pointerEvents = which === "have" ? "auto" : "none";
}

function resetCheck() {
  state.checked = false;
  state.info = null;
  state.skipped = false;
  $("checkStatus").innerHTML = "";
  $("checkInfo").innerHTML = "";
  $("checkReport").innerHTML = "";
  $("skipCheck").style.display = "none";
  $("step1Next").disabled = true;
}

function infoHTML(r) {
  var lines = r.lines || [];
  var h = '<div class="profile"><div class="avatar">' + esc((SERVICE || "?").charAt(0).toUpperCase()) + '</div><div>' +
    '<div class="name">' + esc(r.title || LINK.found || "Найдено") + '</div>';
  if (lines.length) h += '<div class="phone">' + esc(lines[0]) + '</div>';
  for (var i = 1; i < lines.length; i++) h += '<div class="uid">' + esc(lines[i]) + '</div>';
  return h + "</div></div>";
}

if (canCreate) {
  $("seg").style.display = "flex";
  $("segNew").textContent = CREATE.tab || "Создать на сайте";
  $("segHave").textContent = CREATE.have || "Есть ссылка";
  $("createDesc").textContent = CREATE.desc || "";
  $("createBtn").textContent = CREATE.button || ("Открыть " + SERVICE);
}

$("linkUrl").value = VAL.url || "";
$("linkUrl").addEventListener("input", function () {
  $("copyBtn").style.display = "none";
  resetCheck();
});
$("linkUrl").addEventListener("keydown", function (e) {
  if (e.key === "Enter") { e.preventDefault(); $("checkBtn").click(); }
});

function runCheck() {
  var url = $("linkUrl").value.trim();
  resetCheck();
  if (!url) { $("checkStatus").innerHTML = badge("err", "Вставьте ссылку"); return; }
  if (LINK.https !== false && !/^https:\/\//i.test(url)) { $("checkStatus").innerHTML = badge("err", "Ссылка должна начинаться с https://"); return; }
  state.url = url;
  $("checkBtn").disabled = true;
  $("checkStatus").innerHTML = badge("wait", SPIN + (LINK.checking || "Проверяю…"));
  api("check", { url: url }).then(function (r) {
    $("checkBtn").disabled = false;
    if (r.ok) {
      if (r.url) { state.url = r.url; $("linkUrl").value = r.url; }
      state.checked = true;
      state.info = r;
      $("checkStatus").innerHTML = badge("ok", esc(r.title || LINK.found || "Найдено")) +
        (r.warn ? ' ' + badge("warn", esc(r.warn)) : "");
      $("checkInfo").innerHTML = infoHTML(r);
      $("checkReport").innerHTML = reportHTML(r.steps, false);
      $("step1Next").disabled = false;
    } else {
      $("checkStatus").innerHTML = badge("err", esc(r.error || "Не удалось проверить"));
      $("checkReport").innerHTML = reportHTML(r.steps, true);
      if (r.network) $("skipCheck").style.display = "block";
    }
  }).catch(function (e) {
    $("checkBtn").disabled = false;
    $("checkStatus").innerHTML = badge("err", esc(String(e)));
  });
}

$("checkBtn").onclick = runCheck;

$("skipCheck").onclick = function (e) {
  e.preventDefault();
  state.url = $("linkUrl").value.trim();
  state.skipped = true;
  $("checkStatus").innerHTML = badge("wait", "Не проверено");
  $("step1Next").disabled = false;
};

$("segNew").onclick = function () { setSeg("new"); };
$("segHave").onclick = function () { setSeg("have"); };

$("createBtn").onclick = function () {
  if (!canCreate) return;
  resetCheck();
  $("createBtn").disabled = true;
  $("createStatus").innerHTML = badge("wait", SPIN + (CREATE.waiting || "Откройте нужную страницу в окне…"));
  window.openfluxLogin({
    url: CREATE.url,
    title: CREATE.title || SERVICE,
    capture: { page: { match: CREATE.match || "", hint: CREATE.hint || "" } }
  }).then(function (stored) {
    var got = null;
    try { got = JSON.parse(stored); } catch (e) {}
    if (!got || typeof got.url !== "string" || !got.url) throw new Error("Окно не вернуло адрес страницы");
    $("createBtn").disabled = false;
    $("createStatus").innerHTML = "";
    $("linkUrl").value = got.url;
    $("copyBtn").style.display = "";
    setSeg("have");
    runCheck();
  }).catch(function (e) {
    $("createBtn").disabled = false;
    $("createStatus").innerHTML = badge("err", esc((e && e.message) || String(e)));
  });
};

// Optional account sign-in (cfg.account): a sign-in window hands the script the site's session (cookies), which the
// transport's /api/account route uses to make the link (e.g. create a board) and/or report what the session can do.
// Only when the app can open a sign-in window.
var ACCOUNT = CFG.account || null;
var canAccount = !!(ACCOUNT && typeof window.openfluxLogin === "function");
if (canAccount) {
  $("accountBox").style.display = "block";
  $("accountBtn").textContent = ACCOUNT.button || ("Войти в " + SERVICE);
  if (ACCOUNT.desc) { $("accountDesc").textContent = ACCOUNT.desc; } else { $("accountDesc").style.display = "none"; }
}

if (canAccount) $("accountBtn").onclick = function () {
  resetCheck();
  $("accountBtn").disabled = true;
  $("accountReport").innerHTML = "";
  $("accountStatus").innerHTML = badge("wait", SPIN + (ACCOUNT.waiting || "Войдите в открывшемся окне…"));
  window.openfluxLogin({
    url: ACCOUNT.url,
    title: ACCOUNT.loginTitle || SERVICE,
    capture: { cookies: true, page: { match: ACCOUNT.match || "", hint: ACCOUNT.hint || "" } }
  }).then(function (stored) {
    $("accountStatus").innerHTML = badge("wait", SPIN + "Проверяю вход…");
    return api("account", { capture: stored });
  }).then(function (r) {
    $("accountBtn").disabled = false;
    if (r && r.ok) {
      $("accountStatus").innerHTML = badge("ok", esc(r.title || "Вход выполнен")) + (r.warn ? ' ' + badge("warn", esc(r.warn)) : "");
      $("accountReport").innerHTML = (r.lines && r.lines.length ? infoHTML(r) : "") + reportHTML(r.steps, false);
      if (r.url) { $("linkUrl").value = r.url; $("copyBtn").style.display = ""; setSeg("have"); runCheck(); }
    } else {
      $("accountStatus").innerHTML = badge("err", esc((r && r.error) || "Не удалось войти"));
      $("accountReport").innerHTML = reportHTML(r && r.steps, true);
    }
  }).catch(function (e) {
    $("accountBtn").disabled = false;
    $("accountStatus").innerHTML = badge("err", esc((e && e.message) || String(e)));
  });
};

$("copyBtn").onclick = function () {
  var el = $("linkUrl");
  var done = function () { $("copyBtn").textContent = "Скопировано"; setTimeout(function () { $("copyBtn").textContent = "Копировать"; }, 1500); };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(el.value).then(done, function () {});
    return;
  }
  el.select();
  try { if (document.execCommand("copy")) done(); } catch (e) {}
};

setSeg(canCreate && !$("linkUrl").value.trim() ? "new" : "have");
$("step1Next").onclick = function () { goStep(2); };

// ── Step 2: the mode ──

$("step2Back").onclick = function () { goStep(1); };
$("step2Next").onclick = function () { goStep(3); };

// ── Step 3: summary + submit ──

function optionValue(key) { return !!$("opt_" + key) && $("opt_" + key).checked; }

function renderSummary() {
  var rows = [[LINK.summary || "Ссылка", state.url]];
  rows.push(["Проверка", state.checked ? "пройдена" : "не проводилась"]);
  rows.push(["Нода", $("onlyClient").checked ? "уже работает, настраивается только клиент" : "настраивается этим мастером"]);
  for (var i = 0; i < OPTIONS.length; i++) {
    if (optionValue(OPTIONS[i].key)) rows.push([OPTIONS[i].short || OPTIONS[i].label, "включено"]);
  }
  var html = "";
  for (var j = 0; j < rows.length; j++) {
    html += '<div class="summary-row"><span class="key">' + esc(rows[j][0]) + '</span><span class="val">' + esc(rows[j][1]) + '</span></div>';
  }
  $("summary").innerHTML = html;
}

function copy(o) {
  var out = {};
  for (var k in o) if (Object.prototype.hasOwnProperty.call(o, k)) out[k] = o[k];
  return out;
}

// What each end keeps: the link and the options are the same for both. The core tells a node it is the node, so there
// is no exit flag.
function payload() {
  var shared = { url: state.url };
  for (var i = 0; i < OPTIONS.length; i++) {
    if (optionValue(OPTIONS[i].key)) shared[OPTIONS[i].key] = "true";
  }
  var client = copy(shared);
  if ($("onlyClient").checked) return { client: client };
  return { client: client, node: copy(shared) };
}

$("step3Back").onclick = function () { goStep(2); };

$("submitBtn").onclick = function () {
  var data = payload();
  if (window.openfluxSubmit) {
    window.openfluxSubmit(data);
  } else {
    // Outside the app there is nobody to take it: show what would be handed over.
    $("summary").innerHTML += '<div class="hint-box" style="margin-top:12px">' +
      '<code>openfluxSubmit</code> не найден — открыто вне приложения.<br>' +
      'Данные: <pre style="white-space:pre-wrap;font-size:11px;margin-top:4px">' + esc(JSON.stringify(data, null, 2)) + '</pre></div>';
  }
};
</script>
</body>
